<!doctype html>
<html lang="en">
<head>
	<title>silver-data test</title>
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../index.css">
	<style type="text/css">

		form {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 1em;

			h2 { text-align:center; margin-block:0em; }

			select { height:7em; }
		}

		textarea, output {
			background-color:white;
			padding:1em;
			font-size: 14px;
		}

		[data-test=pass] {
			outline:5px solid lime;
		}

		[data-test=fail] {
			outline:5px solid red;
		}

		textarea {
			font-family: monospace;
			min-height: 64em;
		}
		output {
			font-family: sans-serif;
			border-radius:1em;
		}
	</style>
</head>
<body>
	<form name="test">
		<select name="testName" size="7">
			<option selected>assignment-string</option>
			<!-- <option>array</option>
			<option>html</option> -->
		</select>
		<select name="testType" size="7">
			<option selected>json</option>
			<option value="json-with-types">json with types</option>
		</select>
		<h2>test file</h2>

		<textarea name="silverInput" spellcheck="false"></textarea>
		<textarea name="jsonOutput" spellcheck="false" readonly data-test=""></textarea>
		<textarea name="testJson" spellcheck="false" readonly></textarea>
	</form>

	<script type="module">
		import * as silverData from '../silver-data.js';
		import { fileExtension } from '../core/main.js';

		async function changeTest() {
			console.clear();
			const testName = document.forms['test'].testName.value;
			let silverInput = (await import(`./file/${testName}.agd`, { with: { type:'text' }})).default;
			document.forms['test'].silverInput.value = silverInput;

			const testType = document.forms['test'].testType.value;
			const ext = fileExtension[testType];
			console.log(testType,ext);

			let testJson = (await import(`./file/${testName}.${ext}`, { with: { type:'text' }})).default;
			document.forms['test'].testJson.value = testJson;
			update();
		}


		async function update() {

			let silverInput = document.forms['test'].silverInput.value;
			let generatedJson = silverData.silverToJSON(silverInput);
			//console.log(generatedJson);
			document.forms['test'].jsonOutput.value = generatedJson;

			let testJson = document.forms['test'].testJson.value;
			let testResult = (generatedJson === testJson);

			document.forms['test'].jsonOutput.dataset.test = (testResult) ? 'pass' : 'fail';

		}
		document.forms['test']['testName'].addEventListener('change', changeTest);
		document.forms['test']['testType'].addEventListener('change', changeTest);
		document.forms['test']['silverInput'].addEventListener('input', update);
		changeTest();
	</script>
</body>
</html>
